 <!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelPulse Gallery Pro</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#10b981',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Montserrat', sans-serif;
    }
    .gallery-item {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    .star-rating input {
      display: none;
    }
    .star-rating label {
      cursor: pointer;
      font-size: 1.5rem;
      color: #d1d5db;
      transition: color 0.2s;
    }
    .star-rating input:checked ~ label,
    .star-rating input:hover ~ label {
      color: #f59e0b;
    }
    .parallax-bg {
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }
    .filter-btn.active {
      background-color: #6366f1;
      color: white;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- Hero Section with Vanta.js Background -->
  <div id="vanta-bg" class="min-h-screen flex flex-col justify-center items-center text-center px-4 relative overflow-hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50 z-10"></div>
    <div class="relative z-20 max-w-4xl mx-auto">
      <h1 class="text-5xl md:text-7xl font-bold text-white mb-6 animate-fade-in">PixelPulse Gallery Pro</h1>
      <p class="text-xl md:text-2xl text-gray-200 mb-10">Where every pixel tells a story</p>
      <a href="#gallery" class="inline-block bg-primary hover:bg-primary-600 text-white font-medium py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105 shadow-lg">
        Explore Gallery
      </a>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sticky top-0 z-50 bg-white bg-opacity-90 backdrop-filter backdrop-blur-lg shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex-shrink-0 flex items-center">
          <span class="text-primary font-bold text-xl">PixelPulse</span>
        </div>
        <div class="hidden md:block">
          <div class="ml-10 flex items-center space-x-8">
            <a href="#gallery" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">Gallery</a>
            <a href="#categories" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">Categories</a>
            <a href="#about" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">About</a>
            <a href="#contact" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">Contact</a>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <button class="p-2 rounded-full hover:bg-gray-100">
            <i data-feather="search"></i>
          </button>
          <button class="p-2 rounded-full hover:bg-gray-100">
            <i data-feather="user"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Gallery Section -->
  <section id="gallery" class="py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="text-3xl font-bold text-gray-900 mb-4">Featured Works</h2>
      <p class="text-gray-600 max-w-2xl mx-auto">Professionally curated collection of visually stunning images</p>
    </div>

    <!-- Filter Buttons -->
    <div id="categories" class="flex flex-wrap justify-center gap-2 mb-12">
      <button class="filter-btn active px-4 py-2 rounded-full text-sm font-medium bg-gray-100 hover:bg-primary hover:text-white transition-colors" data-filter="all">All</button>
      <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 hover:bg-primary hover:text-white transition-colors" data-filter="nature">Nature</button>
      <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 hover:bg-primary hover:text-white transition-colors" data-filter="urban">Urban</button>
      <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 hover:bg-primary hover:text-white transition-colors" data-filter="portrait">Portrait</button>
      <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-100 hover:bg-primary hover:text-white transition-colors" data-filter="abstract">Abstract</button>
    </div>

    <!-- Gallery Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Gallery Item 1 -->
      <div class="gallery-item nature" data-category="nature">
        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300">
          <div class="relative overflow-hidden h-64 cursor-pointer" onclick="openModal('Snapchat-799039828.jpg')">
            <img src="Snapchat-799039828.jpg" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
          </div>
        </div>
      </div>

      <!-- Gallery Item 2 -->
      <div class="gallery-item urban" data-category="urban">
        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300">
          <div class="relative overflow-hidden h-64 cursor-pointer" onclick="openModal('http://static.photos/cityscape/640x360/2')">
            <img src="http://static.photos/cityscape/640x360/2" alt="Cityscape" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
          </div>
        </div>
      </div>

      <!-- Gallery Item 3 -->
      <div class="gallery-item portrait" data-category="portrait">
        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300">
          <div class="relative overflow-hidden h-64 cursor-pointer" onclick="openModal('http://static.photos/people/640x360/3')">
            <img src="http://static.photos/people/640x360/3" alt="Portrait" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
          </div>
        </div>
      </div>

      <!-- Gallery Item 4 -->
      <div class="gallery-item abstract" data-category="abstract">
        <div class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300">
          <div class="relative overflow-hidden h-64 cursor-pointer" onclick="openModal('http://static.photos/abstract/640x360/4')">
            <img src="http://static.photos/abstract/640x360/4" alt="Abstract Art" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110">
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex justify-center items-center z-50">
    <span class="absolute top-5 right-8 text-white text-3xl cursor-pointer" onclick="closeModal()">&times;</span>
    <img id="modalImage" class="max-h-[90%] max-w-[90%] rounded-lg shadow-lg border-4 border-white">
  </div>

  <script>
    function openModal(src) {
      document.getElementById("modalImage").src = src;
      document.getElementById("imageModal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("imageModal").classList.add("hidden");
    }
    feather.replace();
  </script>
</body>
</html>
